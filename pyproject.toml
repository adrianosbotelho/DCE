[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dev-context-engine"
version = "1.28.0"
description = "Dev Context Engine — offline context builder for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "DCE Contributors" }]
keywords = ["mcp", "context", "sqlite", "fts5", "kiro", "offline", "dce"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0,<3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "twine>=5.0",
    "types-PyYAML>=6.0",
]
portable = [
    "pyinstaller>=6.0",
]

[project.urls]
Homepage = "https://github.com/adrianosbotelho/DCE"
Documentation = "https://github.com/adrianosbotelho/DCE/blob/main/docs/MCP.md"
Repository = "https://github.com/adrianosbotelho/DCE"
Changelog = "https://github.com/adrianosbotelho/DCE/blob/main/CHANGELOG.md"
Packaging = "https://github.com/adrianosbotelho/DCE/blob/main/docs/Packaging.md"

[project.scripts]
dce = "dce.interfaces.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dce"]

[tool.hatch.build.targets.wheel.force-include]
"src/dce/interfaces/web/static/index.html" = "dce/interfaces/web/static/index.html"

[tool.hatch.build.targets.sdist]
include = [
    "/src/dce",
    "/tests",
    "/docs",
    "/packaging",
    "/scripts",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: packaging build and wheel smoke (optional locally)",
]
addopts = [
    "--cov=dce",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["dce"]
omit = ["dce/interfaces/cli/main.py", "dce/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dce"]
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
