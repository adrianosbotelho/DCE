name: Publish

# Uses PyPI Trusted Publisher (OIDC). One-time setup on pypi.org:
#   owner=adrianosbotelho  repo=DCE  workflow=publish.yml  environment=pypi
# Local / token fallback remains: ./scripts/publish.sh --upload (PYPI_TOKEN).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "PyPI target"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build
        run: |
          rm -rf dist
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        if: ${{ inputs.target == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to TestPyPI
        if: ${{ inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
